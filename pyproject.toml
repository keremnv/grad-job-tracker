[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grad-job-watch"
version = "1.0.0"
description = "Conservative monitoring of public UK early-career software and AI job postings"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.13,<4"]
chat-mcp = ["psycopg[binary]>=3.2.13,<4", "mcp>=1.30,<2"]
embeddings = ["psycopg[binary]==3.2.13", "transformers==5.20.2", "torch==2.14.1", "safetensors==0.8.0", "tokenizers==0.23.3", "huggingface-hub==2.3.0"]

[project.scripts]
grad-job-watch = "jobwatch.cli:main"
jobwatch-db-migrate = "jobwatch.postgres.migrate:main"
jobwatch-pg = "jobwatch.postgres.scan:main"
jobwatch-pg-import = "jobwatch.postgres.import_cli:main"
jobwatch-pg-ops = "jobwatch.postgres.operations:main"
jobwatch-read-tools = "jobwatch.postgres.read_tools:main"
jobwatch-owner-mcp = "jobwatch.postgres.owner_mcp:main"
jobwatch-read-mcp = "jobwatch.postgres.read_mcp:main"
jobwatch-read-probe = "jobwatch.postgres.connection_probe:main"
jobwatch-embeddings = "jobwatch.postgres.embeddings:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobwatch.postgres" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/grad-job-watch" = ["sql/postgresql/owner_workflows.sql"]
